<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка Progressus - Генерация отчетов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #fee;
            border-radius: 8px;
            border: 1px solid #fcc;
        }
        
        .success {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #efe;
            border-radius: 8px;
            border: 1px solid #cfc;
        }
        
        .download-link {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .download-link:hover {
            background: #229954;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Админка Progressus</h1>
        <p class="subtitle">Генерация Excel отчетов с аналитикой</p>
        
        <form id="reportForm" onsubmit="generateReport(event)">
            <div class="form-group">
                <label for="startDate">Дата начала периода (dd.mm.yy)</label>
                <input 
                    type="text" 
                    id="startDate" 
                    name="startDate" 
                    placeholder="01.01.24"
                    required
                    pattern="\d{2}\.\d{2}\.\d{2}"
                >
                <div class="hint">Формат: день.месяц.год (например, 01.01.24)</div>
            </div>
            
            <div class="form-group">
                <label for="endDate">Дата конца периода (dd.mm.yy)</label>
                <input 
                    type="text" 
                    id="endDate" 
                    name="endDate" 
                    placeholder="31.12.24"
                    required
                    pattern="\d{2}\.\d{2}\.\d{2}"
                >
                <div class="hint">Формат: день.месяц.год (например, 31.12.24)</div>
            </div>
            
            <button type="submit" id="submitBtn">Сгенерировать отчет</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666;">Генерация отчета...</p>
            </div>
            
            <div id="error" class="error" style="display: none;"></div>
            <div id="success" class="success" style="display: none;"></div>
        </form>
    </div>
    
    <script>
        function generateReport(event) {
            event.preventDefault();
            
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            
            // Скрываем предыдущие сообщения
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Показываем загрузку
            submitBtn.disabled = true;
            loading.style.display = 'block';
            
            // Отправляем запрос
            fetch('/admin/generate-report', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    startDate: startDate,
                    endDate: endDate
                })
            })
            .then(async response => {
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    return response.json();
                } else {
                    // Если сервер вернул HTML вместо JSON, читаем как текст
                    const text = await response.text();
                    throw new Error('Сервер вернул неверный формат ответа. Попробуйте еще раз.');
                }
            })
            .then(data => {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                
                if (data.error) {
                    errorDiv.textContent = 'Ошибка: ' + data.error;
                    errorDiv.style.display = 'block';
                } else if (data.downloadUrl) {
                    const fullUrl = window.location.origin + data.downloadUrl;
                    successDiv.innerHTML = `Отчет успешно сгенерирован!<br><a href="${fullUrl}" class="download-link" download>Скачать Excel файл</a>`;
                    successDiv.style.display = 'block';
                } else {
                    errorDiv.textContent = 'Неожиданный формат ответа от сервера';
                    errorDiv.style.display = 'block';
                }
            })
            .catch(error => {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                errorDiv.textContent = 'Ошибка при генерации отчета: ' + error.message;
                errorDiv.style.display = 'block';
            });
        }
    </script>
</body>
</html>
